<form id="form" action="#">
  <p class="emptyState">Nothing on your list yet.</p>
  <ul id="list"></ul>
</form>

<footer class="toolbar">
  <button id="js-add" class="add-item">
    <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>Add item
  </button>
</footer>

<!-- Add Item -->
<div id="js-modal" class="modal is-hidden">
  <div class="modal__container">
    <h4 class="modal__title">Add item</h4>
    <input type="text" name="input" placeholder="Item name">
    <div class="modal__actions">
      <button id="btnCancel" class="btn-cancel">Cancel</button>
      <button id="btnAdd" class="btn-add">Add</button>
    </div>
  </div>
</div>

<!-- Javascript Support -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
